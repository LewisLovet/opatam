/* ============================================================
   OPATAM — TEMPLATE STORY « PROGRAMME DE FIDÉLITÉ »  (1080 x 1920)
   Le prestataire annonce sa carte de fidélité à ses clientes.
   Tout se règle dans le bloc CONFIG en bas de ce fichier.
   ============================================================ */

:root{
  --bleu-1:#2A4AA5;
  --bleu-2:#1B2F6E;
  --bleu-nuit:#152551;
  --jaune:#F4C928;
  --blanc:#FFFFFF;
  --gris:#6B7793;
  --encre:#22304F;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
body{font-family:'Switzer',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}

.story{
  position:relative;width:1080px;height:1920px;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 6%, rgba(86,126,224,.55) 0%, rgba(86,126,224,0) 60%),
    linear-gradient(168deg, var(--bleu-1) 0%, var(--bleu-2) 58%, var(--bleu-nuit) 100%);
  display:flex;flex-direction:column;
  padding:96px 72px 96px;
}
.story::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
  background-size:4px 4px;mix-blend-mode:overlay;
}

/* ---------- Header ---------- */
.head{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;}
.brand{display:flex;align-items:center;gap:22px;}
.brand img{height:58px;width:auto;display:block;}
.brand .wordmark{font-family:'Clash Display',sans-serif;font-weight:700;font-size:40px;color:#fff;letter-spacing:.13em;line-height:1;}
.eyebrow{
  font-family:'Switzer',sans-serif;font-weight:700;font-size:22px;
  color:var(--jaune);letter-spacing:.34em;text-transform:uppercase;padding-top:4px;
}

/* ---------- Accroche ---------- */
.stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;}

.hook{text-align:center;margin-bottom:152px;}
.hook h1{
  font-family:'Clash Display',sans-serif;font-weight:700;
  font-size:72px;line-height:1.1;color:#fff;letter-spacing:-.02em;
}
.hook h1 em{font-style:normal;color:var(--jaune);}
.hook p{
  margin-top:26px;font-weight:500;font-size:30px;line-height:1.4;
  color:rgba(255,255,255,.78);
}

/* ---------- Carte de fidélité ---------- */
.card{
  position:relative;width:100%;background:var(--blanc);border-radius:56px;
  padding:148px 70px 62px;box-shadow:0 60px 120px rgba(9,20,54,.42);text-align:center;
}
.avatar{
  position:absolute;top:-112px;left:50%;transform:translateX(-50%);
  width:224px;height:224px;border-radius:50%;
  background:#dfe4f2 center/cover no-repeat;border:10px solid var(--blanc);
  box-shadow:0 22px 46px rgba(9,20,54,.34);
}
.enseigne{
  font-family:'Clash Display',sans-serif;font-weight:700;font-size:62px;
  line-height:1.06;color:var(--bleu-2);letter-spacing:-.015em;
}
.meta{margin-top:12px;font-weight:500;font-size:28px;color:var(--gris);}

/* ---- le ticket : une vraie carte de fidélité cartonnée ---- */
.ticket{
  position:relative;margin:34px -14px 0;padding:34px 40px 30px;
  background:
    repeating-linear-gradient(90deg, rgba(27,47,110,.022) 0 2px, transparent 2px 5px),
    linear-gradient(180deg,#FCF9EF 0%, #F5F1E2 100%);
  border:3px dashed #C6CEE2;border-radius:30px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9), 0 6px 0 rgba(27,47,110,.05);
}
/* encoches latérales : le repère visuel du ticket */
.ticket::before,.ticket::after{
  content:"";position:absolute;top:50%;width:52px;height:52px;border-radius:50%;
  background:var(--blanc);transform:translateY(-50%);
}
.ticket::before{left:-29px;} .ticket::after{right:-29px;}

.ticket-head{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding-bottom:22px;border-bottom:2px dashed #D6DCEA;
}
.ticket-titre{
  font-family:'Clash Display',sans-serif;font-weight:600;font-size:25px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--bleu-2);
}
.ticket-gain{
  font-family:'Clash Display',sans-serif;font-weight:700;font-size:27px;
  color:var(--bleu-2);background:var(--jaune);padding:9px 20px;border-radius:999px;
  white-space:nowrap;
}

/* rangée de tampons */
.tampons{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin:30px auto 0;}
.tampon{
  position:relative;width:112px;height:112px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Clash Display',sans-serif;font-weight:600;font-size:32px;
  color:#A6AFC6;border:3px dashed #BFC8DD;background:rgba(255,255,255,.62);
}
/* tampon apposé : encre bleue, double cercle, légèrement de travers */
.tampon.plein{
  border:5px solid var(--bleu-2);background:transparent;color:var(--bleu-2);opacity:.94;
}
.tampon.plein::after{
  content:"";position:absolute;inset:9px;border-radius:50%;
  border:2px solid rgba(27,47,110,.45);
}
.tampon.plein svg{width:46px;height:46px;display:block;position:relative;z-index:1;}
.tampon.plein:nth-child(odd){transform:rotate(-9deg);}
.tampon.plein:nth-child(even){transform:rotate(7deg);}

/* case récompense : sceau cranté */
.tampon.recompense{
  border:none;background:transparent;color:var(--bleu-2);
  font-family:'Clash Display',sans-serif;font-weight:700;font-size:31px;
  filter:drop-shadow(0 10px 22px rgba(244,201,40,.5));
}
.tampon.recompense svg.seal{position:absolute;inset:0;width:100%;height:100%;}

}

.detail{

}

}
.url{margin-top:24px;font-weight:600;font-size:25px;color:rgba(255,255,255,.8);letter-spacing:.04em;}

  type     : "pourcentage",            // "pourcentage" ou "euros"
  valeur   : 20,                       // 20 → −20 %  ou  −20 €

  prestations : [],                    // liste utilisée par "sauf" et "seulement"

  eyebrow  : "NOUVEAU",
  titre    : null,                     // null = généré automatiquement
  soustitre: "Notre carte de fidélité démarre aujourd'hui.",
  detail   : "Rien à remplir : vos rendez-vous pris sur Opatam se cumulent tout seuls.",
  cta      : "Réservez chez blomd.nails",
  url      : "opatam.com/p/blomd-nails"
};

/* ---------- rendu ---------- */
function recompense(c){
  return c.type === "euros" ? "−" + c.valeur + " €" : "−" + c.valeur + " %";
}

function render(){
  const c = CONFIG;
  const reco = recompense(c);

  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('enseigne').textContent = c.enseigne;
  const metaEl = document.getElementById('meta');
  metaEl.textContent = c.meta || ""; metaEl.style.display = c.meta ? "" : "none";
  document.getElementById('avatar').style.backgroundImage = `url("${c.photo}")`;
  document.getElementById('cta').textContent = c.cta;
  document.getElementById('url').textContent = c.url;

  // accroche
  document.getElementById('titre').innerHTML = c.titre
    ? c.titre
    : `Tous les ${c.seuil} rendez-vous,<br><em>${reco} sur le suivant.</em>`;
  const sous = document.getElementById('soustitre');
  sous.textContent = c.soustitre || ""; sous.style.display = c.soustitre ? "" : "none";

  // tampons : seuil-1 cases + la case récompense
  let html = "";
  for (let i = 1; i < c.seuil; i++){
    const plein = i <= c.tamponsRemplis;
    html += plein
      ? `<div class="tampon plein">${CHECK}</div>`
      : `<div class="tampon">${i}</div>`;
  }
  html += `<div class="tampon recompense">${sceau()}<span>${reco}</span></div>`;
  document.getElementById('tampons').innerHTML = html;

  // au-delà de 5 RDV, les tampons rétrécissent / se répartissent sur 2 rangées équilibrées
  if (c.seuil > 5){
    const parRangee = c.seuil <= 6 ? c.seuil : Math.ceil(c.seuil / 2);
    const t = Math.min(112, Math.floor((940 - (parRangee - 1) * 24) / parRangee));
    document.getElementById('tampons').style.maxWidth = (parRangee * t + (parRangee - 1) * 24 + 6) + "px";
    document.getElementById('tampons').style.margin = "28px auto 0";
    document.querySelectorAll('.tampon').forEach(el => {
      el.style.width = t + "px"; el.style.height = t + "px";
      el.style.fontSize = Math.round(t * (el.classList.contains('recompense') ? .28 : .30)) + "px";
      const sv = el.querySelector('svg:not(.seal)');
      if (sv){ sv.style.width = Math.round(t * .41) + "px"; sv.style.height = Math.round(t * .41) + "px"; }
    });
  }

  // règle + éligibilité
  let elig = "Toutes les prestations y ouvrent droit.";
  if (c.eligibilite === "sauf" && c.prestations.length)
    elig = "Toutes les prestations sauf : " + c.prestations.join(", ") + ".";
  if (c.eligibilite === "seulement" && c.prestations.length)
    elig = "Prestations concernées : " + c.prestations.join(", ") + ".";
  document.getElementById('regle').textContent = elig;
  if (elig.length > 58) document.getElementById('tampons').parentNode.querySelector('.ticket-pied').style.fontSize = "21px";
  document.getElementById('ticketGain').textContent = c.seuil + " RDV";

  const det = document.getElementById('detail');
  det.textContent = c.detail || ""; det.style.display = c.detail ? "" : "none";
}

const CHECK = '<svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12.6l5 5.2L19.5 6.6" stroke="#1B2F6E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* sceau cranté (bord festonné) pour la case récompense */
function sceau(){
  const n = 22, R = 50, r = 43, c = 50;
  let d = "";
  for (let i = 0; i < n * 2; i++){
    const ang = (Math.PI * i) / n - Math.PI / 2;
    const rad = i % 2 === 0 ? R : r;
    d += (i ? "L" : "M") + (c + rad * Math.cos(ang)).toFixed(2) + " " + (c + rad * Math.sin(ang)).toFixed(2) + " ";
  }
  return `<svg class="seal" viewBox="0 0 100 100"><path d="${d}Z" fill="#F4C928"/></svg>`;
}
render();
</script>
